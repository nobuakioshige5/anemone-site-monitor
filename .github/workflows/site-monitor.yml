name: site-monitor

# GitHub の定期実行は混雑時に数時間に1回まで間引かれる(2026-10 実測で4〜6時間おき)。
# そこで1回の実行の中で60分ごとにチェックを繰り返し(最大5.5時間)、
# 毎時の起動は「前の実行がまだ動いていなければ引き継ぐ」役にする。
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Skip if another run is already monitoring
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow site-monitor.yml --status in_progress --json databaseId -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID})] | length")
          echo "other in-progress runs: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      # 前回の異常状態を引き継ぐ(新規検知・復旧・6時間ごとの再通知の判定用)
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: site-monitor-state-${{ github.run_id }}
          restore-keys: site-monitor-state-
      - if: steps.guard.outputs.skip != 'true'
        run: python check_sites.py --loop-minutes 330 --interval-minutes 60
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: state
          key: site-monitor-state-${{ github.run_id }}
